[package]
name = "pinveil-fs"
version = "0.0.0"
description = "Private, directory-anchored file operations for the pinveil CLI"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"

# Not `workspace = true`: Windows has no safe API for creating a file with a security
# descriptor, so the one module that calls Win32 for it allows unsafe at audited sites.
# Everything else in the crate stays safe; unsafe is `deny`, not `forbid`, only for that.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
