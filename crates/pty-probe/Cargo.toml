[package]
name = "pty-probe"
version = "0.0.0"
description = "Test-only probe proving the terminal harness on every CI target. Never shipped."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pty-probe"
path = "src/main.rs"

[dependencies]
rpassword = "7.5.4"

[dev-dependencies]
expectrl = "0.9.0"
tempfile = "3.27.0"

[target."cfg(unix)".dev-dependencies]
libc = "0.2.191"
