[package]
name = "pinveil-server"
version = "0.0.0"
description = "Pinveil server: stores opaque encrypted blobs and serves the web UI"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pinveil-server"
path = "src/main.rs"

[[test]]
name = "contract"
path = "tests/contract/main.rs"

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
humantime = "2.4.0"
ipnet = "2.12.2"
pinveil-core = { version = "0.0.0", path = "../pinveil-core" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
tower = { version = "0.5.3", features = ["util"] }
