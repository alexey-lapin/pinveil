[package]
name = "pinveil-server"
version = "0.0.0"
description = "Pinveil server: stores opaque encrypted blobs and serves the web UI"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pinveil-server"
path = "src/main.rs"

[[test]]
name = "contract"
path = "tests/contract/main.rs"

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
pinveil-core = { version = "0.0.0", path = "../pinveil-core" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
