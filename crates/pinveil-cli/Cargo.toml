[package]
name = "pinveil-cli"
version = "0.0.0"
description = "Pinveil command-line client"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pinveil"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
pinveil-core = { version = "0.0.0", path = "../pinveil-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "multipart"] }
