[package]
name = "pinveil-cli"
version = "0.0.0"
description = "Pinveil command-line client"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pinveil"
path = "src/main.rs"

# Not `workspace = true`: the integration tests need one audited unsafe call (setsid, to run
# the CLI without a controlling terminal), so unsafe is `deny` here, overridable at that one
# site, instead of the workspace's `forbid`. The binary forbids unsafe in its own source.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[[test]]
name = "cli"
path = "tests/cli/main.rs"

[dependencies]
directories = "6.0.0"
mime_guess = "2.0.5"
pinveil-core = { version = "0.0.0", path = "../pinveil-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "multipart", "blocking"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.1.8"
url = "2"
usage-lib = { version = "7.1.4", default-features = false }
zeroize = "1.9.1"

[dev-dependencies]
expectrl = "0.9.0"
pinveil-server = { version = "0.0.0", path = "../pinveil-server" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }

[target."cfg(unix)".dev-dependencies]
libc = "0.2.191"
