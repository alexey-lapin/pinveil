[package]
name = "pinveil-core"
version = "0.0.0"
description = "Pinveil message format, crypto, and validation shared by the server and CLI"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11.1"
aes-kw = "0.3.1"
base64 = "0.23.1"
getrandom = "0.4.3"
pbkdf2 = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
zeroize = "1.9.1"

[dev-dependencies]
proptest = "1.12.0"
