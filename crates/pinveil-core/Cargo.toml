[package]
name = "pinveil-core"
version = "0.0.0"
description = "Pinveil message format, crypto, and validation shared by the server and CLI"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
aes-kw = { version = "0.3.1", features = ["zeroize"] }
base64 = "0.23.1"
getrandom = "0.4.3"
hmac = { version = "0.13.0", features = ["zeroize"] }
pbkdf2 = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", features = ["zeroize"] }
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
proptest = "1.12.0"
