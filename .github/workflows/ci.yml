name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check formatting
        run: cargo fmt --all --check

  # Native runners for every release platform. Clippy runs here too, so code behind
  # cfg(windows) / cfg(unix) is linted on the platform that compiles it.
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # The Linux release binaries are musl builds; build and run the whole suite against them.
  test-musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        run: cargo test --workspace --locked --target ${{ matrix.target }}

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/js
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # zip.test.js checks the browser zip writer with independent readers.
      - name: Install zip readers
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 unzip

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  # Playwright against a real pinveil-server, in all three browser engines.
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build server
        run: cargo build --locked -p pinveil-server

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y python3

      - name: Test
        working-directory: tests/browser
        env:
          PINVEIL_SERVER_BIN: ${{ github.workspace }}/target/debug/pinveil-server
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: tests/browser/test-results
          retention-days: 7
