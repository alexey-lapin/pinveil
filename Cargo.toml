[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Optimize dependencies in dev and test builds: the crypto tests run real 600,000-iteration
# PBKDF2, which is slow in an unoptimized build.
[profile.dev.package."*"]
opt-level = 3
